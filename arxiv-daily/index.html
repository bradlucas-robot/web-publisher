<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ArXiv Daily - 具身智能与强化学习</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: #0f172a;
            color: #e2e8f0;
            min-height: 100vh;
            padding: 60px 20px;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
        }
        header {
            text-align: center;
            margin-bottom: 50px;
        }
        h1 {
            font-size: 2.5em;
            margin-bottom: 15px;
            color: #38bdf8;
        }
        .subtitle {
            color: #94a3b8;
            font-size: 1.1em;
        }
        .paper-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .paper-item {
            display: block;
            background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
            border: 1px solid #334155;
            border-radius: 12px;
            padding: 20px 24px;
            text-decoration: none;
            color: inherit;
            transition: all 0.3s;
        }
        .paper-item:hover {
            border-color: #38bdf8;
            transform: translateX(8px);
        }
        .item-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .item-content h3 {
            font-size: 1.1em;
            color: #e2e8f0;
        }
        .item-date {
            color: #64748b;
            font-size: 0.9em;
        }
        .item-link {
            color: #38bdf8;
            font-size: 1.2em;
        }
        footer {
            margin-top: 60px;
            text-align: center;
            color: #64748b;
            font-size: 0.9em;
            padding-top: 30px;
            border-top: 1px solid #1e293b;
        }
        footer a {
            color: #38bdf8;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>📚 ArXiv Daily</h1>
            <p class="subtitle">具身智能与强化学习领域最新论文</p>
        </header>
        
        <div class="paper-list">
            <a href="arxiv-2026-02-03/" class="paper-item">
                <div class="item-content">
                    <h3>📚 2026-02-03</h3>
                    <span class="item-date">5 篇论文</span>
                    <span class="item-link">→</span>
                </div>
            </a>
        </div>
        
        <footer>
            <p>🤖 自动生成 by <a href="https://github.com/openclaw/web-publisher">Web Publisher</a></p>
            <p>📡 数据来源: <a href="https://arxiv.org/">arXiv</a></p>
            <p style="margin-top: 10px;">⚠️ 当前为示例数据，arXiv API 暂时不可用</p>
        </footer>
    </div>
</body>
</html>
